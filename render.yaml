services:
  - type: web
    name: proyecto-oct
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DB_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
